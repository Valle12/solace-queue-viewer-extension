name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "What version part do you want to change?"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - minor
          - patch

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bump version
        run: |
          git checkout -b version
          bun pm version ${{ inputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump ${{ inputs.version }} version"
          git push -u origin version

      - name: PR to main
        run: gh pr create -B main -H version -t "Bump version" -b "New version" --no-maintainer-edit

      - name: Merge PR
        run: gh pr merge version -d -m

  create-zip:
    runs-on: ubuntu-latest
    needs: update-version
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Build project
        run: bun run build

      - name: Extract version
        id: extract-version
        run: |
          echo VERSION=$(cat package.json \
                    | grep version \
                    | head -1 \
                    | awk -F: '{ print $2 }' \
                    | sed 's/[\", ]//g') >> $GITHUB_OUTPUT

      - name: Create zip file
        run: |
          cd dist
          zip -r ../sqve-v${{ steps.extract-version.outputs.VERSION }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: sqve-v${{ steps.extract-version.outputs.VERSION }}.zip
          if-no-files-found: error
          overwrite: true
          name: sqve-v${{ steps.extract-version.outputs.VERSION }}.zip

  create-release:
    runs-on: ubuntu-latest
    needs: create-zip
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: sqve-v${{ needs.create-zip.outputs.version }}.zip
          path: .

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: sqve-v${{ needs.create-zip.outputs.version }}.zip
          name: SQVE v${{ needs.create-zip.outputs.version }}
          tag_name: v${{ needs.create-zip.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: true
