name: Test

on:
  push:
    branches: main
  pull_request:
    branches: main
    # Skip the "Bump version" PR of the release workflow. It is merged and its
    # branch deleted right away, so the run would fail before starting a job
    paths-ignore:
      - package.json

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Run unit tests
        run: bun test

      - name: Install playwright browser
        run: bun run playwright:install

      - name: Run e2e tests
        env:
          SOLACE_EMAIL: ${{ secrets.SOLACE_EMAIL }}
          SOLACE_PASSWORD: ${{ secrets.SOLACE_PASSWORD }}
        run: bun run e2e
